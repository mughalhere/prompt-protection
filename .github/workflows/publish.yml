name: Publish to npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for npm Trusted Publisher (OIDC)
  contents: write # Release asset: CycloneDX SBOM

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pin to npm@11 — npm@latest
      # (12.x) requires Node ^22.22.2 / ^24.15 / >=26, which breaks on 22.14.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run prepublishOnly

      # Auth via OIDC Trusted Publisher — no NPM_TOKEN.
      # Provenance attestations are generated automatically.
      - name: Publish to npm
        # A pre-release version (e.g. 4.0.0-rc.1) goes to the `next` dist-tag so `latest` never moves to it.
        run: |
          if node -e "process.exit(/-/.test(require('./package.json').version) ? 0 : 1)"; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Attach SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A pre-release version is flagged so the repo's "Latest" release never points at an rc.
        run: |
          if node -e "process.exit(/-/.test(require('./package.json').version) ? 0 : 1)"; then PRE=--prerelease; else PRE=; fi
          gh release create "$GITHUB_REF_NAME" sbom.cdx.json --generate-notes --verify-tag $PRE || gh release upload "$GITHUB_REF_NAME" sbom.cdx.json --clobber

  pypi-build:
    name: Build and test the Python package
    # A pre-release tag (a `-` in the name) publishes npm to `next` and skips PyPI. The `${{ }}` form
    # is required, because a bare leading `!` is a YAML tag.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # No id-token here: this job runs unpinned transitive tooling and holds no publish rights.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Lockstep versions: the tag, package.json and __version__ must agree before anything builds.
      - name: Version gate
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NPM_VERSION="$(node -p "require('./package.json').version")"
          PY_VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/src/prompt_protection/__init__.py)"
          echo "tag=$TAG_VERSION package.json=$NPM_VERSION __version__=$PY_VERSION"
          if [ "$TAG_VERSION" != "$NPM_VERSION" ] || [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch between the tag, package.json and __version__"
            exit 1
          fi

      # Editable: pytest imports python/src, the tree the build packages. Runs after the version gate.
      - name: Install Python tooling and the package
        run: python -m pip install -r python/requirements-dev.txt -e ./python

      - name: Test
        working-directory: python
        run: python -m pytest

      - name: Build sdist and wheel
        run: python -m build python

      - name: Check distribution metadata
        run: python -m twine check python/dist/*

      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error
          retention-days: 1

  pypi:
    name: Publish to PyPI
    needs: [publish, pypi-build]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Upload only: no checkout, no install, no script. PyPI Trusted Publisher needs only OIDC.
    permissions:
      id-token: write

    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      # Auth via OIDC Trusted Publisher — no API token.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
