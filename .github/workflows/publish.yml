name: Publish to npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for npm Trusted Publisher (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pin to npm@11 — npm@latest
      # (12.x) requires Node ^22.22.2 / ^24.15 / >=26, which breaks on 22.14.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run prepublishOnly

      # Auth via OIDC Trusted Publisher — no NPM_TOKEN.
      # Provenance attestations are generated automatically.
      - name: Publish to npm
        run: npm publish --access public
